<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
#stage{flex:1;min-height:0;position:relative;display:flex;justify-content:center}
#stage svg{height:100%;max-width:100%}
#rnd{position:absolute;top:8px;right:8px}
#ui{background:var(--pn);border-top:2px solid var(--bd);border-radius:18px 18px 0 0;padding:6px 8px 8px}
.row{display:flex;gap:6px;overflow-x:auto;padding:4px 2px}
button{font:inherit;color:var(--fg);background:var(--pn);border:2px solid var(--bd);border-radius:14px;min-height:44px;padding:4px 12px;white-space:nowrap;cursor:pointer}
button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.t{min-width:62px;display:flex;flex-direction:column;align-items:center;padding:2px 6px;font-size:20px}
.t small{font-size:11px}
.sw{min-width:44px;width:44px;padding:0;border-radius:50%;border-width:3px}
.sw.on{border-color:var(--fg);background-clip:padding-box}
#rnd,#pic{background:var(--ac);color:#fff;border-color:var(--ac)}
#pic{position:absolute;top:8px;left:8px}
button.f{box-shadow:0 0 0 2px var(--fg) inset}
#hdl{display:flex;justify-content:center;align-items:center;width:100%;min-height:30px;padding:0;border:0;background:none;font-size:13px;opacity:.85;border-radius:10px}
#hdl::before{content:'';width:34px;height:4px;border-radius:2px;background:var(--bd);margin-right:8px}
#ui.min #tabs,#ui.min #opts{display:none}
#opts{max-height:34vh;overflow-y:auto}
#dlg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#dlg.on{display:flex}
#dlg div{background:var(--pn);color:var(--fg);border-radius:18px;padding:18px;max-width:320px;text-align:center}
#dlg p{margin:0 0 14px}#dlg button{margin:4px}
#toast{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:14px;display:none;z-index:10}
#rl,#rr{position:absolute;top:45%;width:48px;padding:0;font-size:20px;opacity:.85}#rl{left:8px}#rr{right:8px}
#stage{touch-action:pan-y;user-select:none}.row small{align-self:center;opacity:.7;padding:0 4px;white-space:nowrap}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
</style></head><body>

const makePng=()=>new Promise((res,rej)=>{const svg=$('#fig').cloneNode(true);svg.setAttribute('width','900');svg.setAttribute('height','1530');const xml=new XMLSerializer().serializeToString(svg),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=900;c.height=1530;c.getContext('2d').drawImage(img,0,0,900,1530);c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png')};img.onerror=()=>rej(new Error('img'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)});
$('#pic').onclick=async()=>{try{const blob=await makePng(),name='figur-'+new Date().toISOString().slice(0,10)+'.png';const cap=window.Capacitor;if(cap&&cap.isNativePlatform&&cap.isNativePlatform()){try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)});window._ps=window._ps||cap.registerPlugin('PhotoSaver');await window._ps.save({data:b64,name});toast('Foto in der Galerie gespeichert')}catch(e){toast('Speichern nicht möglich')}return}
